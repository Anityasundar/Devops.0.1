services:
  frontend:
    build: ./frontend
    ports:
      - "8090:80"
    depends_on:
      - backend

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      DB_HOST: database
      DB_PASSWORD: devopsroot
      DB_USER: root
      DB_NAME: employee_db
    depends_on:
      - database

  database:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: devopsroot
      MYSQL_DATABASE: employee_db
    volumes:
      - employee-db-data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  employee-db-data:
